<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Pemesanan | BukuKita</title><link rel="stylesheet" href="css/style.css"></head><body><div id="app"></div><script src="data.js"></script><script src="js/app.js"></script><script>
if(wajibLogin()){renderLayout("Pemesanan Buku","checkout");const user=penggunaAktif();const kodeDipilih=localStorage.getItem("bukuDipilih")||dataKatalogBuku[0].kodeBarang;const daftar=[...dataKatalogBuku,...JSON.parse(localStorage.getItem("bukuTambahan")||"[]")];
document.getElementById("content").innerHTML=`<div class="grid grid-2"><div class="card"><h3>Informasi Pemesan</h3><form id="formPesan"><div class="field"><label>Nama lengkap</label><input id="namaPemesan" value="${user.nama}" required></div><div class="field"><label>Email</label><input id="emailPemesan" type="email" value="${user.email}" required></div><div class="field"><label>Alamat pengiriman</label><textarea id="alamat" rows="3" required placeholder="Masukkan alamat lengkap"></textarea></div><div class="field"><label>Nomor telepon</label><input id="telepon" type="tel" pattern="[0-9+ ]{9,15}" required placeholder="08xxxxxxxxxx"></div><h3>Informasi Pembayaran</h3><div class="field"><label>Metode pembayaran</label><select id="metode"><option value="Transfer Bank">Transfer Bank</option><option value="E-Wallet">E-Wallet</option><option value="COD">Bayar di tempat (COD)</option></select></div><button class="btn full">Buat Pesanan</button></form></div>
<div class="card"><h3>Ringkasan Pesanan</h3><div class="field"><label>Pilih buku</label><select id="pilihBuku">${daftar.map(b=>`<option value="${b.kodeBarang}" ${b.kodeBarang===kodeDipilih?"selected":""}>${b.namaBarang} — ${rupiah(b.harga)}</option>`).join("")}</select></div><div class="field"><label>Jumlah</label><input id="jumlah" type="number" min="1" value="1"></div><div class="order-item"><span class="muted">Harga satuan</span><b id="hargaSatuan"></b></div><div class="order-item"><span class="muted">Subtotal</span><b id="subtotal"></b></div><div class="order-item"><span class="muted">Ongkos kirim</span><b>Rp 15.000</b></div><div class="order-item"><b>Total pembayaran</b><b id="total"></b></div><p class="muted" style="font-size:12px">Nomor DO dibuat otomatis setelah pesanan disimpan.</p></div></div>`;
const pilih=document.getElementById("pilihBuku"),jumlah=document.getElementById("jumlah");function hitung(){const b=daftar.find(x=>x.kodeBarang===pilih.value);const qty=Math.max(1,Number(jumlah.value)||1);document.getElementById("hargaSatuan").textContent=rupiah(b.harga);document.getElementById("subtotal").textContent=rupiah(b.harga*qty);document.getElementById("total").textContent=rupiah(b.harga*qty+15000);jumlah.max=b.stok}
pilih.addEventListener("change",hitung);jumlah.addEventListener("input",hitung);hitung();
document.getElementById("formPesan").addEventListener("submit",e=>{e.preventDefault();const b=daftar.find(x=>x.kodeBarang===pilih.value);const qty=Number(jumlah.value);if(qty<1||qty>b.stok){alert("Jumlah pesanan melebihi stok yang tersedia.");return}const doNumber=String(Date.now()).slice(-8);const order={nomorDO:doNumber,nama:document.getElementById("namaPemesan").value,email:document.getElementById("emailPemesan").value,buku:b.namaBarang,kode:b.kodeBarang,jumlah:qty,total:b.harga*qty+15000,metode:document.getElementById("metode").value,tanggal:new Date().toLocaleDateString("id-ID"),status:"Pesanan dibuat"};const orders=semuaPesanan();orders.push(order);localStorage.setItem("dataPesanan",JSON.stringify(orders));localStorage.setItem("nomorDOBaru",doNumber);localStorage.removeItem("bukuDipilih");alert("Pesanan berhasil dibuat! Nomor DO: "+doNumber);location.href="transaksi.html"});
}
</script></body></html>
