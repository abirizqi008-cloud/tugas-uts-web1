<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Dashboard | BukuKita</title><link rel="stylesheet" href="css/style.css"></head><body><div id="app"></div><script src="data.js"></script><script src="js/app.js"></script><script>
if(wajibLogin()){renderLayout("Dashboard","dashboard");const user=penggunaAktif();const pesanan=semuaPesanan();document.getElementById("content").innerHTML=`
  <div class="card" style="background:linear-gradient(115deg,#3157d5,#5878e6);color:white;margin-bottom:20px">
    <div style="font-size:13px;opacity:.85">BUKUKITA ONLINE STORE</div><h2 style="font-size:25px;margin:10px 0">${waktuGreeting()}, ${user.nama.split(" ")[0]}!</h2><p style="margin:0;color:#e5ebff">Semoga harimu menyenangkan. Mau membaca buku apa hari ini?</p>
  </div>
  <div class="grid grid-3">
    <div class="card stats"><div><div class="muted">Katalog buku</div><div class="stat-number">${dataKatalogBuku.length}</div></div><span>📚</span></div>
    <div class="card stats"><div><div class="muted">Total stok</div><div class="stat-number">${dataKatalogBuku.reduce((a,b)=>a+b.stok,0).toLocaleString("id-ID")}</div></div><span>▤</span></div>
    <div class="card stats"><div><div class="muted">Pesanan tersimpan</div><div class="stat-number">${pesanan.length}</div></div><span>🧾</span></div>
  </div>
  <h3 style="margin:28px 0 15px">Menu utama</h3>
  <div class="grid grid-2">
    <a class="card" href="stok.html"><h3>📚 Informasi Stok/Katalog</h3><p class="muted">Lihat daftar buku, harga, dan ketersediaan stok.</p><span class="btn secondary">Buka katalog →</span></a>
    <a class="card" href="tracking.html"><h3>📦 Tracking Pengiriman</h3><p class="muted">Pantau status pengiriman menggunakan nomor DO.</p><span class="btn secondary">Lacak pesanan →</span></a>
    <a class="card" href="laporan.html"><h3>📊 Laporan Pemesanan</h3><p class="muted">Lihat ringkasan seluruh pesanan yang dibuat.</p><span class="btn secondary">Lihat laporan →</span></a>
    <a class="card" href="transaksi.html"><h3>🕘 History Transaksi</h3><p class="muted">Periksa kembali riwayat transaksi.</p><span class="btn secondary">Lihat transaksi →</span></a>
  </div>`}
</script></body></html>
