<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Laporan | BukuKita</title><link rel="stylesheet" href="css/style.css"></head><body><div id="app"></div><script src="data.js"></script><script src="js/app.js"></script><script>
if(wajibLogin()){renderLayout("Laporan Pemesanan","laporan");const orders=semuaPesanan();const total=orders.reduce((a,o)=>a+Number(o.total),0);document.getElementById("content").innerHTML=`<div class="grid grid-3"><div class="card"><div class="muted">Jumlah pesanan</div><div class="stat-number">${orders.length}</div></div><div class="card"><div class="muted">Total nilai pesanan</div><div class="stat-number" style="font-size:22px">${rupiah(total)}</div></div><div class="card"><div class="muted">Jenis pembayaran</div><div class="stat-number">${new Set(orders.map(o=>o.metode)).size}</div></div></div><div class="card" style="margin-top:18px"><h3>Daftar Laporan</h3><div class="table-wrap"><table><thead><tr><th>Nomor DO</th><th>Pemesan</th><th>Buku</th><th>Jumlah</th><th>Total</th><th>Tanggal</th></tr></thead><tbody>${orders.length?orders.map(o=>`<tr><td>${o.nomorDO}</td><td>${o.nama}</td><td>${o.buku}</td><td>${o.jumlah}</td><td>${rupiah(o.total)}</td><td>${o.tanggal}</td></tr>`).join(""):`<tr><td colspan="6" class="empty">Belum ada data pemesanan. Silakan buat pesanan terlebih dahulu.</td></tr>`}</tbody></table></div></div>`}
</script></body></html>
