<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>History Transaksi | BukuKita</title><link rel="stylesheet" href="css/style.css"></head><body><div id="app"></div><script src="data.js"></script><script src="js/app.js"></script><script>
if(wajibLogin()){renderLayout("History Transaksi","transaksi");const orders=semuaPesanan().slice().reverse();document.getElementById("content").innerHTML=`<div class="card"><div class="toolbar"><div><h3 style="margin:0">Riwayat transaksi</h3><p class="muted" style="margin:6px 0 0">Daftar pesanan yang pernah dibuat dari akun ini.</p></div><button class="btn secondary" onclick="location.href='checkout.html'">＋ Pesan buku</button></div><div class="table-wrap"><table><thead><tr><th>Nomor DO</th><th>Tanggal</th><th>Nama Buku</th><th>Jumlah</th><th>Pembayaran</th><th>Total</th><th>Status</th></tr></thead><tbody>${orders.length?orders.map(o=>`<tr><td><b>${o.nomorDO}</b></td><td>${o.tanggal}</td><td>${o.buku}</td><td>${o.jumlah}</td><td>${o.metode}</td><td>${rupiah(o.total)}</td><td><span class="status">${o.status}</span></td></tr>`).join(""):`<tr><td colspan="7" class="empty">Belum ada transaksi.</td></tr>`}</tbody></table></div></div>`}
</script></body></html>
