<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Katalog Buku | BukuKita</title><link rel="stylesheet" href="css/style.css"></head><body><div id="app"></div><div class="modal-backdrop" id="modalTambah"><div class="modal"><div class="modal-head"><h3>Tambah Stok Buku</h3><button class="close" onclick="tutupModal('modalTambah')">×</button></div><form id="formTambah"><div class="field"><label>Kode barang</label><input id="kode" required></div><div class="field"><label>Nama buku</label><input id="nama" required></div><div class="form-grid"><div class="field"><label>Jenis</label><input id="jenis" value="Buku Ajar" required></div><div class="field"><label>Edisi</label><input id="edisi" type="number" min="1" value="1" required></div><div class="field"><label>Stok</label><input id="stokBaru" type="number" min="0" required></div><div class="field"><label>Harga (Rp)</label><input id="harga" type="number" min="1" required></div></div><button class="btn full">Simpan buku</button></form></div></div>
<script src="data.js"></script><script src="js/app.js"></script><script>
if(wajibLogin()){renderLayout("Informasi Stok/Katalog","stok");const tambahan=JSON.parse(localStorage.getItem("bukuTambahan")||"[]");let katalog=[...dataKatalogBuku,...tambahan];
document.getElementById("content").innerHTML=`<div class="toolbar"><input id="cariBuku" placeholder="Cari kode atau nama buku..."><button class="btn" onclick="bukaModal('modalTambah')">＋ Tambah stok</button></div><div class="card"><div class="table-wrap"><table><thead><tr><th>Kode</th><th>Nama Buku</th><th>Jenis</th><th>Edisi</th><th>Stok</th><th>Harga</th><th>Aksi</th></tr></thead><tbody id="tabelBuku"></tbody></table></div></div>`;
function renderBuku(filter=""){const tbody=document.getElementById("tabelBuku");const hasil=katalog.filter(b=>(b.kodeBarang+" "+b.namaBarang).toLowerCase().includes(filter.toLowerCase()));tbody.innerHTML=hasil.length?hasil.map((b)=>`<tr><td><b>${b.kodeBarang}</b></td><td>${b.namaBarang}</td><td>${b.jenisBarang}</td><td>${b.edisi}</td><td>${b.stok}</td><td>${rupiah(b.harga)}</td><td><button class="btn secondary" onclick="pesanBuku('${b.kodeBarang}')">Pesan</button></td></tr>`).join(""):`<tr><td colspan="7" class="empty">Buku tidak ditemukan.</td></tr>`}
window.pesanBuku=kode=>{localStorage.setItem("bukuDipilih",kode);location.href="checkout.html"};
document.getElementById("cariBuku").addEventListener("input",e=>renderBuku(e.target.value));renderBuku();
document.getElementById("formTambah").addEventListener("submit",e=>{e.preventDefault();const kode=document.getElementById("kode").value.trim().toUpperCase();if(katalog.some(b=>b.kodeBarang===kode)){alert("Kode barang sudah digunakan.");return}const buku={kodeBarang:kode,namaBarang:document.getElementById("nama").value.trim(),jenisBarang:document.getElementById("jenis").value.trim(),edisi:document.getElementById("edisi").value,stok:Number(document.getElementById("stokBaru").value),harga:Number(document.getElementById("harga").value),cover:""};tambahan.push(buku);localStorage.setItem("bukuTambahan",JSON.stringify(tambahan));katalog.push(buku);renderBuku();e.target.reset();tutupModal("modalTambah");alert("Data buku berhasil ditambahkan.");});
}
</script></body></html>
