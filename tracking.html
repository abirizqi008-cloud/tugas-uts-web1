<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Tracking | BukuKita</title><link rel="stylesheet" href="css/style.css"></head><body><div id="app"></div><script src="data.js"></script><script src="js/app.js"></script><script>
if(wajibLogin()){renderLayout("Tracking Pengiriman","tracking");document.getElementById("content").innerHTML=`<div class="card"><h3>Lacak paket Anda</h3><p class="muted">Masukkan nomor Delivery Order (DO) untuk melihat perkembangan pengiriman.</p><form id="formTracking" style="display:flex;gap:10px;flex-wrap:wrap"><input id="nomorDO" required placeholder="Contoh: 20230012" style="flex:1;min-width:200px;border:1px solid var(--line);border-radius:9px;padding:12px"><button class="btn">Cari</button></form><p class="muted" style="font-size:12px">Nomor demo: 20230012 atau 20230013.</p></div><div id="hasilTracking" style="margin-top:18px"></div>`;
document.getElementById("formTracking").addEventListener("submit",e=>{e.preventDefault();const nomor=document.getElementById("nomorDO").value.trim();let d=dataTracking[nomor];const order=semuaPesanan().find(o=>o.nomorDO===nomor);if(!d&&order)d={nomorDO:order.nomorDO,nama:order.nama,status:"Pesanan dibuat",ekspedisi:"Kurir Toko BukuKita",tanggalKirim:order.tanggal,paket:"REGULER",total:order.total,perjalanan:[{waktu:order.tanggal,keterangan:"Pesanan diterima dan sedang diproses."}]};const target=document.getElementById("hasilTracking");if(!d){target.innerHTML=`<div class="card empty">Nomor DO tidak ditemukan. Periksa kembali nomor yang dimasukkan.</div>`;return}const selesai=d.status.toLowerCase().includes("selesai")||d.status.toLowerCase().includes("dikirim");const persen=selesai?100:d.perjalanan.length>=3?65:30;target.innerHTML=`<div class="card"><div class="toolbar"><div><div class="eyebrow">NOMOR DELIVERY ORDER</div><h2 style="margin:0">${d.nomorDO}</h2></div><span class="status ${selesai?"":"pending"}">${d.status}</span></div><div class="progress"><span style="width:${persen}%"></span></div><div class="grid grid-3"><div><div class="muted">Nama pemesan</div><b>${d.nama}</b></div><div><div class="muted">Ekspedisi</div><b>${d.ekspedisi}</b></div><div><div class="muted">Tanggal kirim</div><b>${d.tanggalKirim}</b></div><div><div class="muted">Jenis paket</div><b>${d.paket}</b></div><div><div class="muted">Total pembayaran</div><b>${rupiah(d.total)}</b></div></div><h3 style="margin-top:28px">Riwayat perjalanan</h3><div class="timeline">${d.perjalanan.map(p=>`<div class="timeline-item"><b>${p.keterangan}</b><div class="muted" style="font-size:12px;margin-top:5px">${p.waktu}</div></div>`).join("")}</div></div>`;});
}
</script></body></html>
