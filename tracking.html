
<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracking | BukuKita</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="app-layout">

        <aside class="sidebar">
            <a class="brand" href="dashboard.html">
                <span class="brand-mark">B</span>
                BukuKita
            </a>

            <p class="side-label">MENU UTAMA</p>

            <nav>
                <a class="side-link" href="dashboard.html">
                    ▦ <span>Dashboard</span>
                </a>

                <a class="side-link" href="stok.html">
                    ▤ <span>Stok / Katalog</span>
                </a>

                <a class="side-link" href="checkout.html">
                    ＋ <span>Pemesanan</span>
                </a>

                <a class="side-link active" href="tracking.html">
                    ⌁ <span>Tracking</span>
                </a>

                <a class="side-link" href="laporan.html">
                    ▥ <span>Laporan</span>
                </a>

                <a class="side-link" href="transaksi.html">
                    ◷ <span>Histori Transaksi</span>
                </a>
            </nav>

            <div class="sidebar-bottom">
                <div class="user-mini">
                    <div class="avatar">A</div>

                    <div>
                        <strong>Admin BukuKita</strong>
                        <small>Administrator</small>
                    </div>
                </div>

                <button class="side-link logout-btn" data-logout>
                    ↪ <span>Keluar</span>
                </button>
            </div>
        </aside>

        <main class="main-content">

            <header class="topbar">
                <div>
                    <span class="eyebrow">DELIVERY MANAGEMENT</span>
                    <h2>Tracking Pengiriman</h2>
                </div>
            </header>

            <section class="page-intro">
                <h1>Lacak paketmu</h1>
                <p>Masukkan nomor Delivery Order untuk melihat detail perjalanan pesanan.</p>
            </section>

            <section class="tracking-search table-card">
                <form id="trackingForm">

                    <label for="trackingInput">
                        Nomor Delivery Order
                    </label>

                    <div class="tracking-input-row">
                        <input
                            id="trackingInput"
                            placeholder="Contoh: DO-2026-001"
                            required
                        >

                        <button class="btn btn-primary" type="submit">
                            Cari paket →
                        </button>
                    </div>

                    <small class="muted">
                        Nomor demo: DO-2026-001
                    </small>

                </form>
            </section>

            <section id="trackingResult" class="tracking-result"></section>

        </main>
    </div>

    <div id="toast" class="toast" role="status"></div>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
